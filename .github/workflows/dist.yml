name: dist

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-dist:
    name: publish built packages to dist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter "./packages/*" build

      - name: Stage packages and tarballs
        run: node scripts/publish-dist.mjs --out /tmp/skyloupe-dist

      - name: Push dist branch
        run: |
          cd /tmp/skyloupe-dist
          git init -b dist
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build ${{ github.sha }}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin dist
